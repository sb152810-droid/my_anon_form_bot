<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зворотний зв'язок ✨</title>
    <!-- Підключаємо офіційний Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #8e44ad;
            --bg: #fdfbf7;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --gray: #7f8c8d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eaeaea;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .success-msg {
            display: none;
            text-align: center;
            color: #27ae60;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💬 Залишити коментар</h1>
    <p class="subtitle">Поділися своїми думками, ідеями чи відгуком про наш канал!</p>

    <form id="feedbackForm">
        <div class="form-group">
            <label>✨ Яку тему чи рубрику ви хотіли б бачити частіше?</label>
            <textarea name="goals" rows="3" placeholder="Напиши свої ідеї..." required></textarea>
        </div>

        <div class="form-group">
            <label>💡 Що найбільше подобається, а чого, можливо, не вистачає?</label>
            <textarea name="improvements" rows="3" placeholder="Твої думки та коментарі..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Надіслати відповідь 🚀</button>
    </form>

    <div id="successMessage" class="success-msg">Дякую! Твоє повідомлення успішно надіслане ❤️</div>
</div>

<script>
    // Ініціалізація Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.textContent = "Надсилаємо...";
        btn.disabled = true;

        // Дістаємо дані юзера з Telegram
        const user = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
        
        const telegramId = user ? user.id : "Браузер / Без Telegram";
        const username = user && user.username ? "@" + user.username : (user ? user.first_name : "Гість");

        const formData = {
            goals: this.goals.value,
            improvements: this.improvements.value,
            telegram_id: telegramId,
            username: username
        };

        // Твоє посилання на Google Apps Script залишається тут незмінним
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzKRC3X9v8aHQd8fzEYuXscz9dvbmnrCuPWUms7_psvKeBQZhWPSvCyF1LZJx95ljn4/exec';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            document.getElementById('feedbackForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
        })
        .catch(error => {
            alert('Помилка відправки. Спробуй ще раз!');
            btn.textContent = "Надіслати відповідь 🚀";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
